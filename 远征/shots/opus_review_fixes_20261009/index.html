<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远征 · 五项验收修正</title>
<style>body{margin:0;background:#17151a;color:#f3e8d0;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}p,figcaption{color:#bfb096}nav,.states{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,a{font:inherit;color:#f3e8d0;background:#26222a;border:1px solid #6e5434;padding:8px 16px;cursor:pointer;text-decoration:none}button[aria-selected=true]{border-color:#f0b95a;color:#f0b95a}.pair{display:flex;gap:20px;overflow:auto}.pair figure{margin:0;flex:0 0 480px}figcaption{margin-bottom:8px}img{display:block;width:480px;height:auto}section[hidden]{display:none}</style>
<main><h1>五项验收修正 · 原生截图</h1><p>左侧为 Opus 审查的 V1，右侧为本轮修正。图片均由 Godot 实际渲染；保留原尺寸，可横向滑动。</p>
<nav><button data-page="title" aria-selected="true">启动页</button><button data-page="world" aria-selected="false">城镇 HUD</button><button data-page="long" aria-selected="false">长屏天空</button><button data-page="states" aria-selected="false">状态与灰度</button></nav>
<section id="title"><div class="pair"><figure><figcaption>V1 · 临时 Logo</figcaption><img src="../opus_round1_20261009/title_800.png" alt="启动页修正前"></figure><figure><figcaption>修正后 · 字标、实时副标题与铜边</figcaption><img src="title_normal_800.png" alt="启动页修正后"></figure></div></section>
<section id="world" hidden><div class="pair"><figure><figcaption>V1 · 抽象地图与轻边圆盘</figcaption><img src="../opus_round1_20261009/town_800.png" alt="城镇HUD修正前"></figure><figure><figcaption>修正后 · 地形地图、填色图标与角标</figcaption><img src="town_800.png" alt="城镇HUD修正后"></figure></div></section>
<section id="long" hidden><div class="pair"><figure><figcaption>V1 · 渐变天空</figcaption><img src="../opus_round1_20261009/title_1067.png" alt="长屏修正前"></figure><figure><figcaption>修正后 · 云层天空与独立品牌</figcaption><img src="title_1067.png" alt="长屏修正后"></figure></div></section>
<section id="states" hidden><p>灰度图在 Godot 内通过屏幕 shader 渲染。交互就绪图暂停了自动接触步骤，用于展示原有效距离内的按钮状态；点击已验证打开原 NPC 对话。</p><div class="states"><a href="town_gray_800.png">HUD 灰度</a><a href="sprint_on_800.png">疾行开启</a><a href="sprint_on_gray_800.png">疾行开启灰度</a><a href="interaction_near_800.png">靠近提示</a><a href="interaction_ready_800.png">交互可用</a><a href="potion_zero_800.png">药剂为零</a><a href="map_expanded_800.png">共享地形展开图</a><a href="title_focus_settings_800.png">键盘焦点</a><a href="town_safe_800.png">安全区</a></div></section>
</main><script>document.querySelectorAll('button[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-page]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.page)});</script></html>
