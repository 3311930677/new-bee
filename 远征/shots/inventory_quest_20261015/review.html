<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行旅界面 · 像素重构</title><style>*{box-sizing:border-box}body{margin:0;background:#10141b;color:#efe3c7;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:30px 24px}h1{font-size:25px;color:#e5bb70;margin:0 0 6px}p{color:#aea58e;margin:0 0 18px}.toolbar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}button{padding:9px 20px;background:#202730;border:1px solid #6f6049;border-radius:5px;color:#efe3c7;cursor:pointer}button.on{background:#265950;border-color:#78b9a5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0;padding:12px;background:#1a2029;border:1px solid #514836;border-radius:8px}figcaption{margin-bottom:10px;color:#e5bb70;font-size:16px}figure img{display:block;width:100%;height:auto;image-rendering:pixelated}details{margin-top:28px;padding:18px;border:1px solid #514836;border-radius:8px}summary{cursor:pointer;color:#e5bb70}.reference{width:100%;margin-top:16px}.states{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:18px}.states img{width:100%;image-rendering:pixelated}.note{font-size:13px;margin-top:24px}@media(max-width:760px){.grid{grid-template-columns:1fr}.states{grid-template-columns:repeat(2,1fr)}}</style><main><h1>行旅界面 · 像素重构</h1><p>深色铁木框 / 暖色纸面 / 青玉主按钮。下方为游戏实际运行截图。</p><div class="toolbar"><button class="on" data-height="800">标准竖屏 · 480 × 800</button><button data-height="1067">长竖屏 · 480 × 1067</button></div><div class="grid"><figure><figcaption>行旅背包 · 选中装备</figcaption><img data-screen="inventory_selected" src="inventory_selected_800.png" alt="装备背包实机截图"></figure><figure><figcaption>待领取 · 空状态</figcaption><img data-screen="inventory_pending" src="inventory_pending_800.png" alt="待领取空状态实机截图"></figure><figure><figcaption>任务卷宗</figcaption><img data-screen="journal" src="journal_800.png" alt="任务卷宗实机截图"></figure></div><details><summary>查看统一设计参考稿</summary><img class="reference" src="../../docs/art_briefs/inventory_quest_20261015/reference.png" alt="统一像素风参考稿"><p class="note">参考图的名称及数值仅为美术示意；实机界面读取游戏数据。</p></details><details><summary>查看更多交互状态</summary><div class="states"><figure><figcaption>材料</figcaption><img src="inventory_mat_800.png" alt="材料"></figure><figure><figcaption>宝石</figcaption><img src="inventory_gem_800.png" alt="宝石"></figure><figure><figcaption>进行中</figcaption><img src="journal_active_800.png" alt="任务进行中"></figure><figure><figcaption>可交付</figcaption><img src="journal_claimable_800.png" alt="任务可交付"></figure></div></details><p class="note">494 项界面功能与布局检查通过，委托逻辑回归通过。截图使用独立存档。测试退出时仍有资源释放提示，记录于测试日志。</p></main><script>document.querySelectorAll("[data-height]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-height]").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("[data-screen]").forEach(img=>img.src=img.dataset.screen+"_"+b.dataset.height+".png")});</script></html>
