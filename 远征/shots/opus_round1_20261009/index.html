<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远征 · 第一轮 UI 前后对比</title>
<style>body{margin:0;background:#17151a;color:#f3e8d0;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}p{color:#bfb096;margin:4px 0 20px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,a{font:inherit;color:#f3e8d0;background:#26222a;border:1px solid #6e5434;padding:8px 16px;cursor:pointer;text-decoration:none}button[aria-selected=true]{border-color:#f0b95a;color:#f0b95a}.pair{display:flex;gap:20px;overflow:auto}.pair figure{margin:0;flex:0 0 480px}figcaption{margin-bottom:8px;color:#bfb096}img{display:block;width:480px;height:auto}.states{display:flex;gap:10px;flex-wrap:wrap}.note{font-size:14px;max-width:920px}section[hidden]{display:none}</style>
<main><h1>《远征》第一轮 UI · V1</h1><p>原生 Godot 截图 · 2026-10-09 · 无后期效果</p><p class="note">左侧修改前，右侧修改后。旧 Logo 和长屏天空采用方案允许的过渡版本，正式资产仍待制作。手机可横向滑动查看原尺寸。</p>
<nav><button data-page="title" aria-selected="true">启动主菜单</button><button data-page="town" aria-selected="false">城镇 HUD</button><button data-page="states" aria-selected="false">更多状态</button></nav>
<section id="title"><div class="pair"><figure><figcaption>修改前 · 480×800</figcaption><img src="before_title_800.png" alt="修改前启动菜单"></figure><figure><figcaption>修改后 · 480×800</figcaption><img src="title_800.png" alt="修改后启动菜单"></figure></div></section>
<section id="town" hidden><div class="pair"><figure><figcaption>修改前 · 480×800</figcaption><img src="before_town_800.png" alt="修改前城镇HUD"></figure><figure><figcaption>修改后 · 480×800</figcaption><img src="town_800.png" alt="修改后城镇HUD"></figure></div></section>
<section id="states" hidden><p>每张图片均保留原生尺寸。长屏、安全区、任务、低血量等用演示状态验证。</p><div class="states"><a href="title_1067.png">菜单长屏</a><a href="town_1067.png">城镇长屏</a><a href="town_safe_800.png">安全区</a><a href="stress_800.png">长文字与大金币</a><a href="tasks_expanded_800.png">任务展开</a><a href="tasks_collapsed_800.png">任务收起</a><a href="sprint_on_800.png">疾行开启</a><a href="low_hp_800.png">低血量</a><a href="potion_zero_800.png">药剂为零</a><a href="map_expanded_1067.png">展开地图</a><a href="field_maple_road.png">野外古道</a><a href="field_frost_post.png">霜关驿站</a><a href="expedition_exit.png">历练撤离</a></div></section>
</main><script>document.querySelectorAll('button[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-page]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.page)});</script></html>
